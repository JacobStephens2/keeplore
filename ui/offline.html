<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#30395c">
  <title>Offline - Keeplore</title>
  <style>
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f8fafc;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      color: #1b2230;
    }
    .container {
      padding: 2rem;
      max-width: 30rem;
    }
    h1 {
      font-family: inherit;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 1rem;
      color: #30395c;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.65;
      color: #5f6777;
      margin: 0 0 1.25rem;
    }
    button {
      color: #f8fbff;
      background: linear-gradient(135deg, #30395c 0%, #3d4668 100%);
      border: none;
      padding: 0.85rem 1.35rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      filter: brightness(1.05);
    }
    button:focus-visible {
      outline: 2px solid #33b1e4;
      outline-offset: 3px;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #0c1222;
        color: #e9edf5;
      }
      h1 {
        color: #9db1d9;
      }
      p {
        color: #a6b0c4;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>You're offline</h1>
    <p>It looks like you've lost your internet connection. Check the connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#30adf4"/>
      <stop offset="100%" stop-color="#73e5c9"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30adf4"/>
      <stop offset="100%" stop-color="#73e5c9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (matches app icon) -->
  <rect width="512" height="512" rx="96" ry="96" fill="#30395c"/>

  <!-- Interact-by tracking arc with gap at top for the timer dot -->
  <circle
    cx="256" cy="256" r="168"
    fill="none"
    stroke="url(#arcGrad)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="980 120"
    stroke-dashoffset="-30"
    opacity="0.95"
  />

  <!-- Timer / cycle accent -->
  <circle cx="256" cy="88" r="12" fill="#33b1e4"/>
  <circle cx="256" cy="88" r="18" fill="#80d0c7" opacity="0.35"/>

  <!-- Geometric capital K (keep monogram) -->
  <!-- Vertical stem -->
  <rect x="150" y="140" width="54" height="232" rx="8" fill="url(#grad)"/>
  <!-- Upper arm -->
  <path d="
    M 204 250
    L 340 140
    L 372 172
    L 240 274
    Z
  " fill="url(#grad)"/>
  <!-- Lower arm -->
  <path d="
    M 220 260
    L 372 372
    L 340 404
    L 204 292
    Z
  " fill="url(#grad)"/>
</svg>

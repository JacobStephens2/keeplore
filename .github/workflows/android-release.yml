name: Release Keeplore Android

on:
  workflow_dispatch:

concurrency:
  group: keeplore-android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEEPLORE_ANDROID_KEYSTORE: ${{ github.workspace }}/capacitor/keystore.jks
      KEEPLORE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEEPLORE_ANDROID_KEYSTORE_PASSWORD }}
      KEEPLORE_ANDROID_KEY_PASSWORD: ${{ secrets.KEEPLORE_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: capacitor/package-lock.json

      - name: Restore and check the existing release identity
        env:
          KEYSTORE_B64: ${{ secrets.KEEPLORE_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Configure KEEPLORE_ANDROID_KEYSTORE_B64 with the existing release keystore}"
          : "${KEEPLORE_ANDROID_KEYSTORE_PASSWORD:?Configure KEEPLORE_ANDROID_KEYSTORE_PASSWORD}"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEEPLORE_ANDROID_KEYSTORE"
          actual=$(keytool -exportcert -keystore "$KEEPLORE_ANDROID_KEYSTORE" \
            -alias artifact-manager -storepass:env KEEPLORE_ANDROID_KEYSTORE_PASSWORD \
            | sha256sum | cut -d ' ' -f 1)
          expected=$(node -e 'const links = require("./ui/.well-known/assetlinks.json"); console.log(links.find(link => link.target.package_name === "app.keeplore").target.sha256_cert_fingerprints[0].replaceAll(":", "").toLowerCase())')
          [[ "$actual" == "$expected" ]] || { echo "The keystore does not match Keeplore's release certificate."; exit 1; }

      - name: Check the release version
        id: version
        run: |
          set -euo pipefail
          node <<'JS' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const { version } = require('./capacitor/package.json');
          const lock = require('./capacitor/package-lock.json');
          const gradle = fs.readFileSync('capacitor/android/app/build.gradle', 'utf8');
          if (!/^\d+\.\d+\.\d+$/.test(version) ||
              lock.version !== version || lock.packages[''].version !== version ||
              !gradle.includes(`versionName "${version}"`)) {
            throw new Error('Android, package and lockfile versions must agree.');
          }
          console.log(`name=${version}`);
          JS
          version=$(node -p 'require("./capacitor/package.json").version')
          if git show-ref --verify --quiet "refs/tags/$version"; then
            echo "The version tag already exists; increase the Android release version."
            exit 1
          fi

      - uses: android-actions/setup-android@v3

      - name: Install the Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install and sync Capacitor
        working-directory: capacitor
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Check and build the signed APK and AAB
        working-directory: capacitor/android
        run: ./gradlew --no-daemon test lint assembleRelease bundleRelease

      - name: Verify and package the release
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            capacitor/android/app/build/outputs/apk/release/app-release.apk
          mkdir dist
          cp capacitor/android/app/build/outputs/apk/release/app-release.apk "dist/keeplore-v$VERSION.apk"
          cp capacitor/android/app/build/outputs/bundle/release/app-release.aab "dist/keeplore-v$VERSION.aab"
          (cd dist && sha256sum "keeplore-v$VERSION.apk" "keeplore-v$VERSION.aab" > SHA256SUMS)
          cat > dist/RELEASE_NOTES.md <<EOF
          The Android app now uses the Keeplore K launcher icon and splash screen.

          - Version: $VERSION, package: app.keeplore
          - Loads https://keeplore.app with native due-date notifications and App Links
          - Signed with the existing Keeplore certificate so it upgrades the 2.1.0 app

          Download the APK for direct installation. The AAB is included for store distribution.
          SHA256SUMS contains the checksums of both downloads.
          EOF

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$VERSION" \
            "dist/keeplore-v$VERSION.apk" "dist/keeplore-v$VERSION.aab" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Keeplore $VERSION — K app icon" \
            --notes-file dist/RELEASE_NOTES.md

      - name: Remove the signing keystore
        if: always()
        run: rm -f "$KEEPLORE_ANDROID_KEYSTORE"
